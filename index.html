<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Contact form</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .my-contact-form {
      width: 500px;
      height: 500px;
      margin: 70px auto;
      padding: 20px;
    }
    .name-form {
      display: flex;
      align-items: center;
    }
    .name-form .name-2 {
      margin-left: 10px;
    }
    .submit-btn {
      text-align: center;
    }
    .submit-btn input {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="my-contact-form">
    <h1>Contact Us</h1>
    <form id="contactForm" method="post">
      <div class="name-form">
        <p class="name-1">
          <label for="fname">First Name *</label>
          <br>
          <input type="text" id="fname" name="fname" required>
        </p>
        <p class="name-2">
          <label for="lname">Last Name *</label>
          <br>
          <input type="text" id="lname" name="lname" required>
        </p>
      </div>
      <p>
        <label for="email">Email *</label>
        <br>
        <input type="text" id="email" name="email" required>
      </p>
      <p>
        <label for="query_type">Query Type *</label>
      </p>
      <p>
        <input type="checkbox" id="enquiry" name="query_type" value="enquiry" required>
        <label for="enquiry">General Enquiry</label>
        <input type="checkbox" id="request" name="query_type" value="request" required>
        <label for="request">Support Request</label>
      </p>
      <p>
        <label for="message">Message *</label>
        <br>
        <textarea name="message" id="message" name="message" required></textarea>
      </p>
      <p>
        <input type="checkbox" id="consent" name="consent" required>
        <label for="consent">I consent to being contacted by the team *</label>
      </p>
      <div class="submit-btn">
        <input type="submit" value="Submit">
      </div>
    </form>
  </div>
</body>
</html>

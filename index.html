<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />
  <title>Frontend Mentor | Contact form</title>

  <style>
    @font-face {
      font-family: 'Karla';
      src: url("assets/fonts/Karla-VariableFont_wght.ttf");
    }
    * {
      font-family: 'Karla';
    }
    body {
      background-color: hsl(148, 38%, 91%);
    }
    .my-contact-form {
      width: 500px;
      margin: 70px auto;
      padding: 20px;
      border-radius: 5%;
      background-color: #fff;
    }
    .my-contact-form h1 {
      margin-bottom: 30px;
      font-size: 26px;
      font-weight: bold;
    }
    .my-contact-form .form-control:active, 
    .my-contact-form .form-control:focus {
      border: 1px #0c7d69ff solid;
      box-shadow: none;
    }
    .my-contact-form .star {
      color: #0c7d69ff;
    }
    input:not([type='radio']), textarea {
      margin-top: 5px;
    }
    .submit-btn input {
      width: 100%;
      background-color: hsl(169, 82%, 27%);
      border-radius: 6px;
      border: none;
      height: 38px;
      color: #fff;
    }
    .form-control {
      width: 100%;
      box-sizing: border-box;
    }
    .chkbox-input {
      display: flex;
      gap: 23px;
      margin-bottom: 1rem;
    }
    .chkbox-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      background-color: white;
      width: 218px;
      margin-top: 10px;
      position: relative;
    }
    .chkbox-option .svg-radio-1 img {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 13px;
      height: 13px;
      display: none;
    }
    .chkbox-option .svg-radio-2 img {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 13px;
      height: 13px;
      display: none;
    }
    #enquiry:checked ~ .svg-radio-1 img,
    #request:checked ~ .svg-radio-2 img {
      display: block;
    }
    .consent-input label {
      margin-left: 10px;
    }
    .input-error {
      border: 1px solid #FF0000;
    }
    .error-msg {
      color: #FF0000;
      font-size: 0.9rem;
      display: none;
    }
    .container {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-20px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      width: 450px;
      padding: 15px;
      border-radius: 10px;
      margin: 15px auto 0;
      background-color: #2b4246ff;
      display: flex;
      justify-content: center;
    }
    .container.show-popup {
      max-height: 200px; /* enough to show full popup content */
      opacity: 1;
      transform: translateY(0);
    }
    .container .popup p {
      color: #fff;
    }
    .container .popup .form-complete {
      margin-top: 2px;
      margin-bottom: 0;
    }
    .container .popup .popup-message {
      font-weight: bold;
    }
    .container .icon-success-check {
      margin-bottom: 3px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="popup" id="popup">
      <p class="popup-message">
        <img class="icon-success-check" src="assets/images/icon-success-check.svg">&nbsp;
        Message sent!
      </p>
      <p class="form-complete">Thanks for completing the form. We'll be in touch soon!</p>
    </div>
  </div>
  <div class="my-contact-form">
    <h1>Contact Us</h1>
    <form id="contactForm" method="post" novalidate>
      <div class="row">
        <div class="col-md-6">
          <label for="fname">First Name <span class='star'>*</span></label>
          <input type="text" id="fname" name="fname" class="form-control" required />
          <p id="fname-error" class="error-msg">This field is required.</p>
        </div>
        <div class="col-md-6">
          <label for="lname">Last Name <span class='star'>*</span></label>
          <input type="text" id="lname" name="lname" class="form-control" required />
          <p id="lname-error" class="error-msg">This field is required.</p>
        </div>
      </div>

      <div class="mt-3">
        <label for="email">Email <span class='star'>*</span></label>
        <input type="text" id="email" name="email" class="form-control" required />
        <p id="email-error" class="error-msg">Please enter a valid email address.</p>
      </div>

      <div class="mt-3">
        <label>Query Type <span class='star'>*</span></label>
        <div class="chkbox-input">
          <div class="chkbox-option">
            <input type="radio" id="enquiry" name="query_type" value="enquiry" />
            <div class="svg-radio-1">
              <img src="assets/images/icon-radio-selected.svg" alt="Selected option">
            </div>
            <label for="enquiry">General Enquiry</label>
          </div>
          <div class="chkbox-option">
            <input type="radio" id="request" name="query_type" value="request" />
            <div class="svg-radio-2">
              <img src="assets/images/icon-radio-selected.svg" alt="Selected option">
            </div>
            <label for="request">Support Request</label>
          </div>
        </div>
        <p id="query-error" class="error-msg">Please select a query type.</p>
      </div>

      <div class="mt-3">
        <label for="message">Message <span class='star'>*</span></label>
        <textarea id="message" name="message" class="form-control" rows="4" required></textarea>
        <p id="message-error" class="error-msg">This field is required.</p>
      </div>

      <div class="mt-3 consent-input">
        <input type="checkbox" id="consent" name="consent" />
        <label for="consent">I consent to being contacted by the team <span class='star'>*</span></label>
        <p id="consent-error" class="error-msg">To submit this form, please consent to being contacted.</p>
      </div>

      <div class="submit-btn mt-4">
        <input type="submit" value="Submit">
      </div>
    </form>
  </div>
  <script src="form_validation.js"></script>
</body>
</html>
